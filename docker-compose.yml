services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudlift
      POSTGRES_USER: cloudlift
      POSTGRES_PASSWORD: cloudliftpass
    ports:
      - "5432:5432"
    volumes:
      - cloudlift_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlift -d cloudlift"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloudlift
      DB_USER: cloudlift
      DB_PASSWORD: cloudliftpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  cloudlift_pgdata:
