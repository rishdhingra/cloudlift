services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudlift
      POSTGRES_USER: cloudlift
      POSTGRES_PASSWORD: local-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlift -d cloudlift"]
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    image: cloudlift-api:resume-demo
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloudlift
      DB_USER: cloudlift
      DB_PASSWORD: local-test-only
    depends_on:
      db:
        condition: service_healthy
